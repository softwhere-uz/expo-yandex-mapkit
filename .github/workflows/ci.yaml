name: CI

# Docs-only changes (markdown, the alias stub, non-CI workflows) skip CI entirely.
# Release version-bump commits ("chore(release): x.y.z" via .npmrc's message config)
# run only the cheap quality job — the v* tag triggers release.yaml, which does the
# full pre-publish verification for that same commit.
on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'alias/**'
      - '.github/workflows/release.yaml'
      - '.github/workflows/mapkit-version-watch.yaml'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'alias/**'
      - '.github/workflows/release.yaml'
      - '.github/workflows/mapkit-version-watch.yaml'
  workflow_dispatch:

# Release version-bump pushes get their own concurrency group so they can never
# cancel an in-flight full CI run (their own run skips the heavy jobs anyway).
concurrency:
  group: ci-${{ github.ref }}-${{ (github.event_name == 'push' && startsWith(github.event.head_commit.message, 'chore(release):')) && 'release' || 'code' }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Lint, build, plugin checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm run build plugin
      - name: Plugin behavior checks
        run: node scripts/check-plugin.mjs
      # Pack twice: the second pack catches stale-incremental-build bugs where
      # `prepare` deletes plugin/build but tsc thinks it is still up to date.
      - name: Tarball guard (x2)
        run: |
          for i in 1 2; do
            npm pack --dry-run --json --foreground-scripts=false | node -e "
              // npm <=10 emits an array; npm >=11 an object keyed by package name.
              const parsed = JSON.parse(require('fs').readFileSync(0, 'utf8'));
              const pkg = Array.isArray(parsed) ? parsed[0] : Object.values(parsed)[0];
              const files = pkg.files.map((f) => f.path);
              const required = ['app.plugin.js', 'build/index.js', 'plugin/build/index.js', 'README.md', 'README.ru.md', 'LICENSE'];
              const missing = required.filter((p) => !files.includes(p));
              const banned = files.filter((p) => p === 'HANDOVER.md' || p.endsWith('.tsbuildinfo') || p.startsWith('alias/'));
              if (missing.length || banned.length) {
                console.error('tarball check failed', { missing, banned });
                process.exit(1);
              }
              console.log('tarball OK:', files.length, 'files');
            "
          done

  prebuild-smoke:
    name: Config plugin prebuild smoke test
    runs-on: ubuntu-latest
    if: github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'chore(release):')
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            example/package-lock.json
      - run: npm ci
      - run: npm ci
        working-directory: example
      - run: npx expo prebuild --platform android --no-install
        working-directory: example
      - run: npx expo prebuild --platform ios --no-install
        working-directory: example
      - name: Assert the plugin injected the native build properties
        run: |
          set -euo pipefail
          VERSION=$(grep -oP "DEFAULT_VERSION = '\K[0-9.]+" plugin/src/index.ts)
          FLAVOR=$(grep -oP "DEFAULT_FLAVOR = '\K[a-z]+" plugin/src/index.ts)
          IOS_TARGET=$(grep -oP "MIN_IOS_DEPLOYMENT_TARGET = '\K[0-9.]+" plugin/src/index.ts)
          grep -Fx "expoYandexMapKit.version=${VERSION}" example/android/gradle.properties
          grep -Fx "expoYandexMapKit.flavor=${FLAVOR}" example/android/gradle.properties
          grep -Fx "android.minSdkVersion=26" example/android/gradle.properties
          node -e "
            const p = require('./example/ios/Podfile.properties.json');
            const [version, flavor, iosTarget] = process.argv.slice(1);
            if (p['expoYandexMapKit.version'] !== version || p['expoYandexMapKit.flavor'] !== flavor) {
              throw new Error('Podfile.properties.json missing plugin keys: ' + JSON.stringify(p));
            }
            // Plugin floors the iOS target (raise-only), so assert >= — a higher SDK
            // template default is valid and must not fail the check.
            const cur = String(p['ios.deploymentTarget'] ?? '').split('.').map(Number);
            const min = iosTarget.split('.').map(Number);
            const below = Number.isNaN(cur[0]) || cur[0] < min[0] || (cur[0] === min[0] && (cur[1] || 0) < (min[1] || 0));
            if (below) {
              throw new Error('Podfile.properties.json ios.deploymentTarget below floor ' + iosTarget + ': ' + JSON.stringify(p));
            }
          " "$VERSION" "$FLAVOR" "$IOS_TARGET"
      - name: Assert prebuild idempotency (no duplicated keys on re-run)
        run: |
          set -euo pipefail
          (cd example && npx expo prebuild --platform android --no-install)
          test "$(grep -c 'expoYandexMapKit.version' example/android/gradle.properties)" = "1"
          test "$(grep -c 'android.minSdkVersion' example/android/gradle.properties)" = "1"

  android:
    name: Android build (Kotlin vs real MapKit)
    runs-on: ubuntu-latest
    if: github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'chore(release):')
    environment: ${{ github.event_name == 'pull_request' && 'ci-heavy-approval' || 'ci-auto' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            example/package-lock.json
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6
      - run: npm ci
      - run: npm ci
        working-directory: example
      - run: npx expo prebuild --platform android --no-install
        working-directory: example
      - name: Compile module Kotlin against the pinned MapKit artifact
        run: ./gradlew :expo-yandex-mapkit:compileDebugKotlin
        working-directory: example/android

  # The bare jobs consume the library the way a real bare-RN user does: pack the
  # tarball, install it --no-save into the committed bare-example fixture (a manually
  # wired RN 0.86 community-template app), and build.
  bare-android:
    name: Bare RN Android build (tarball consumer)
    runs-on: ubuntu-latest
    if: github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'chore(release):')
    environment: ${{ github.event_name == 'pull_request' && 'ci-heavy-approval' || 'ci-auto' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            bare-example/package-lock.json
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6
      - run: npm ci
      - run: npm pack --foreground-scripts=false
      - run: npm ci
        working-directory: bare-example
      - name: Install the packed library
        run: npm install --no-save "$(ls ../expo-yandex-mapkit-*.tgz)"
        working-directory: bare-example
      - name: Build the bare app (single ABI)
        run: ./gradlew :app:assembleDebug -PreactNativeArchitectures=arm64-v8a
        working-directory: bare-example/android

  bare-ios:
    name: Bare RN iOS build (tarball consumer)
    runs-on: macos-26
    if: github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'chore(release):')
    environment: ${{ github.event_name == 'pull_request' && 'ci-heavy-approval' || 'ci-auto' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            bare-example/package-lock.json
      - run: npm ci
      - run: npm pack --foreground-scripts=false
      - run: npm ci
        working-directory: bare-example
      - name: Install the packed library
        run: npm install --no-save "$(ls ../expo-yandex-mapkit-*.tgz)"
        working-directory: bare-example
      - run: pod install
        working-directory: bare-example/ios
      - name: Build for iOS Simulator
        working-directory: bare-example/ios
        run: |
          set -o pipefail
          xcodebuild -workspace BareYandexMapkit.xcworkspace \
            -scheme BareYandexMapkit \
            -configuration Debug \
            -sdk iphonesimulator \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            > xcodebuild.log 2>&1 || { tail -n 200 xcodebuild.log; exit 1; }
          tail -n 5 xcodebuild.log

  ios:
    name: iOS build (Swift vs real MapKit)
    runs-on: macos-26
    if: github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'chore(release):')
    environment: ${{ github.event_name == 'pull_request' && 'ci-heavy-approval' || 'ci-auto' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            example/package-lock.json
      - run: npm ci
      - run: npm ci
        working-directory: example
      - run: npx expo prebuild --platform ios --no-install
        working-directory: example
      - name: Pod install (pulls the pinned YandexMapsMobile pod)
        run: pod install
        working-directory: example/ios
      - name: Build for iOS Simulator
        working-directory: example/ios
        run: |
          set -o pipefail
          xcodebuild -workspace expoyandexmapkitexample.xcworkspace \
            -scheme expoyandexmapkitexample \
            -configuration Debug \
            -sdk iphonesimulator \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            > xcodebuild.log 2>&1 || { tail -n 200 xcodebuild.log; exit 1; }
          tail -n 5 xcodebuild.log
