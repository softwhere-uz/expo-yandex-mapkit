# Release flow (see CONTRIBUTING.md → Releasing):
#   npm version patch|minor|major     # bumps package.json, commits, tags vX.Y.Z
#   git push --follow-tags            # the v* tag triggers this workflow
#
# Publishing uses npm OIDC trusted publishing — configure the "trusted publisher"
# for expo-yandex-mapkit on npmjs.com (Settings → Publishing access) pointing at
# this repo + workflow, so no long-lived npm token exists at all. The scoped alias
# (alias/) re-exports this package via a "*" range and is version-matched to every
# release by the "Publish scoped alias" step below, so its npm page never looks stale.
# That step needs its own trusted-publisher configured for @softwhere-uz/expo-yandex-mapkit
# (same repo + workflow); until that's set up it no-ops without failing the release.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write # create the GitHub release
  id-token: write # npm provenance attestation (OIDC)

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # No registry-url here: it would write an _authToken line into .npmrc, which
      # makes npm skip the OIDC trusted-publishing token exchange (setup-node#1551).
      - uses: actions/setup-node@v6
        with:
          node-version: 22

      # OIDC trusted publishing requires npm >= 11.5.1
      - run: npm install -g npm@latest

      - run: npm ci

      - run: npm run lint

      - run: npm run build

      - run: npm run build plugin

      - name: Verify tag matches package.json version
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $PKG_VERSION" >&2
            exit 1
          fi

      # The packed tarball must contain the compiled config plugin — guards the
      # class of bug where stale tsc build state ships a package whose
      # app.plugin.js points at a missing plugin/build.
      - name: Verify tarball contents
        run: |
          npm pack --dry-run --json --foreground-scripts=false | node -e "
            // npm <=10 emits an array; npm >=11 an object keyed by package name.
            const parsed = JSON.parse(require('fs').readFileSync(0, 'utf8'));
            const pkg = Array.isArray(parsed) ? parsed[0] : Object.values(parsed)[0];
            const files = pkg.files.map((f) => f.path);
            const required = ['app.plugin.js', 'build/index.js', 'plugin/build/index.js'];
            const missing = required.filter((p) => !files.includes(p));
            if (missing.length) { console.error('Missing from tarball:', missing); process.exit(1); }
            console.log('Tarball OK:', files.length, 'files');
          "

      - name: Publish to npm (with provenance)
        run: npm publish --provenance --access public

      # Version-match the scoped alias @softwhere-uz/expo-yandex-mapkit to this release
      # so `npm i @softwhere-uz/expo-yandex-mapkit` and its npm page track the real
      # package. Tolerant of "already published" and a missing trusted-publisher so a
      # first run (or a hand-published version) never blocks the main release.
      - name: Publish scoped alias (version-matched)
        run: |
          cd alias
          npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version
          npm publish --provenance --access public \
            || echo "::warning::alias publish skipped — already published, or no trusted-publisher yet for @softwhere-uz/expo-yandex-mapkit"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --generate-notes
