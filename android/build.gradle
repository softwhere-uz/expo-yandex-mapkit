plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.yandexmapkit'
version = '0.0.1'

// Default MapKit pin — keep in sync with plugin/src/index.ts and ios/ExpoYandexMapKit.podspec.
def mapkitVersion = findProperty('expoYandexMapKit.version') ?: '4.42.0'
def mapkitFlavor  = findProperty('expoYandexMapKit.flavor')  ?: 'lite'

android {
  namespace "expo.modules.yandexmapkit"
  defaultConfig {
    // Yandex MapKit requires API 26 — fail the manifest merger loudly if the app stays below it.
    // Property form (not the `minSdkVersion 26` method): the method DSL was removed in AGP 9
    // (React Native 0.87+); the property works on AGP 7.1+ so SDK 55/56 consumers keep building.
    minSdk = 26
    versionCode 1
    versionName "0.0.1"
  }
  // `lint` (not `lintOptions`): same AGP 9 removal, same AGP 7.1+ compatibility.
  lint {
    abortOnError false
  }

  // Full-flavor-only Kotlin (Search / Suggest / Routing) references classes the lite artifact does
  // not ship, so it must stay out of the lite compile entirely. Select the matching source set: the
  // `full` set has the real implementations; the `lite` set has same-named rejecting stubs. Each
  // flavor-only Expo module (e.g. ExpoYandexSuggestModule) is provided by exactly one of these.
  sourceSets {
    main {
      java.srcDirs += mapkitFlavor == 'full' ? ['src/mapkit/full'] : ['src/mapkit/lite']
    }
  }
}

dependencies {
  api "com.yandex.android:maps.mobile:${mapkitVersion}-${mapkitFlavor}"
}
